<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaxyEU - Home</title>
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0c10;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Floating / Circling Light Glow Animations */
    @keyframes pulseGlow {
      0% {
        text-shadow: 0 0 10px rgba(168, 85, 247, 0.5), 0 0 20px rgba(192, 132, 252, 0.3);
        filter: drop-shadow(0 0 4px rgba(168, 85, 247, 0.6));
      }
      50% {
        text-shadow: 0 0 25px rgba(192, 132, 252, 0.9), 0 0 40px rgba(168, 85, 247, 0.7);
        filter: drop-shadow(0 0 12px rgba(192, 132, 252, 0.9));
      }
      100% {
        text-shadow: 0 0 10px rgba(168, 85, 247, 0.5), 0 0 20px rgba(192, 132, 252, 0.3);
        filter: drop-shadow(0 0 4px rgba(168, 85, 247, 0.6));
      }
    }

    @keyframes rotateBorderGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Color Palette Utility Classes */
    .text-violet {
      color: #c084fc;
      text-shadow: 0 0 12px rgba(192, 132, 252, 0.5);
    }

    /* Navigation Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 80px;
      background: rgba(11, 12, 16, 0.8);
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: #c084fc;
    }

    /* Main Container */
    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
    }

    /* Hero Profile Card */
    .hero-card {
      position: relative;
      background-color: #121318;
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 16px;
      padding: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      margin-bottom: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* Circling Light Ring around Avatar */
    .avatar-wrapper {
      position: relative;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 3px;
    }

    .avatar-wrapper::before {
      content: '';
      position: absolute;
      width: 150px;
      height: 150px;
      background: conic-gradient(from 0deg, transparent 0%, #c084fc 50%, transparent 100%);
      animation: rotateBorderGlow 4s linear infinite;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: #1e1f26;
      object-fit: cover;
      position: relative;
      z-index: 1;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .profile-name {
      font-size: 2.2rem;
      font-weight: 800;
      color: #c084fc;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    .profile-bio {
      color: #94a3b8;
      max-width: 540px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* Status indicator */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
    }

    /* Social Links */
    .social-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .social-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #1e1f28;
      color: #e0e0e0;
      border: 1px solid #2d2f3a;
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.88rem;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      border-color: #c084fc;
      color: #c084fc;
      box-shadow: 0 0 12px rgba(192, 132, 252, 0.3);
      transform: translateY(-2px);
    }

    /* Preview Visual Placeholder */
    .preview-box {
      width: 260px;
      height: 160px;
      background-color: #1a1b22;
      border: 1px dashed rgba(192, 132, 252, 0.4);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #64748b;
      font-size: 0.9rem;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    /* Main Action Button Area */
    .action-container {
      display: flex;
      justify-content: center;
      margin-top: 30px;
    }

    .main-tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #a855f7 0%, #c084fc 100%);
      color: #0b0c10;
      font-weight: 800;
      font-size: 1.1rem;
      padding: 16px 36px;
      border-radius: 14px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
    }

    .main-tool-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(192, 132, 252, 0.6);
      filter: brightness(1.1);
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header>
    <a href="/" class="brand">
      MaxyEU
    </a>
    <nav>
      <a href="/app">Processor Tool</a>
      <a href="#status">Status</a>
    </nav>
  </header>

  <!-- Main Content Container -->
  <main>
    <!-- Profile Card -->
    <div class="hero-card">
      <div>
        <div class="profile-header">
          <!-- Avatar with Circling Light Ring -->
          <div class="avatar-wrapper">
            <img src="{{ url_for('static', filename='avatar.jpg') }}" alt="Avatar" class="avatar-img" onerror="this.src='https://via.placeholder.com/80/121318/c084fc?text=Maxy'">
          </div>
          <h1 class="profile-name">
            MaxyEU <span style="font-size: 1.2rem; color: #64748b; font-weight: 400; text-shadow: none; filter: none;">IT</span>
          </h1>
        </div>

        <p class="profile-bio">
          Creative <strong class="text-violet">Backend Developer</strong> & Editor. Building video tools, APIs, and custom encoding workflows to avoid aggressive compression.
        </p>

        <div class="status-badge">
          <span class="status-dot"></span> All services are online
        </div>

        <div class="social-links">
          <a href="#" class="social-btn">⚙️ GitHub</a>
          <a href="#" class="social-btn">▶ YouTube</a>
          <a href="#" class="social-btn">🎵 TikTok</a>
          <a href="#" class="social-btn">🎧 Spotify</a>
          <a href="#" class="social-btn">💬 Discord</a>
        </div>
      </div>

      <!-- Preview Visual -->
      <div class="preview-box">
        <img src="{{ url_for('static', filename='feature-preview.jpg') }}" alt="Preview Visual" onerror="this.parentElement.innerHTML='📷 Preview Visual'">
      </div>
    </div>

    <!-- Single Action Button to Tool Page -->
    <div class="action-container">
      <a href="/app" class="main-tool-btn">
        🚀 Open Video Processor Tool →
      </a>
    </div>
  </main>

</body>
</html>
