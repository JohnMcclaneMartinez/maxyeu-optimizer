<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxyEU OPTIMIZER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0b14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at center, #1a102f 0%, #0d0b14 70%);
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .header p {
            color: #8b8a9d;
            font-size: 0.9rem;
        }

        .card {
            background: rgba(22, 18, 36, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .step {
            margin-bottom: 24px;
        }

        .step-title {
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-number {
            background: #2a2244;
            color: #b088ff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .file-upload-box {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.02);
        }

        .file-upload-box:hover {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.05);
        }

        input[type="file"] {
            display: none;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .option-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
        }

        .option-card.selected {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.08);
        }

        .option-card input[type="radio"] {
            margin-top: 3px;
            accent-color: #a855f7;
        }

        .option-info h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .option-info p {
            font-size: 0.8rem;
            color: #8b8a9d;
        }

        .tag {
            background: #a855f7;
            color: #ffffff;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            margin-left: 6px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: #cccccc;
            cursor: pointer;
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
        }

        .checkbox-label input {
            accent-color: #a855f7;
        }

        .submit-btn {
            width: 100%;
            background: #a855f7;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #9333ea;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 11, 20, 0.9);
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #a855f7;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MaxyEU Optimizer</h1>
        <p>Choose a video, pick a method, and download the finished file.</p>
    </div>

    <div class="card">
        <form id="optimizeForm" action="/optimize" method="POST" enctype="multipart/form-data">
            
            <!-- STEP 1: VIDEO SELECTION -->
            <div class="step">
                <div class="step-title">
                    <span class="step-number">1</span>
                    Choose your video
                </div>
                <div class="file-upload-box" onclick="document.getElementById('videoFile').click()">
                    <span id="fileNameDisplay">Click to select video file</span>
                    <input type="file" id="videoFile" name="file" accept="video/*" required onchange="updateFileName(this)">
                </div>
            </div>

            <!-- STEP 2: METHOD SELECTION -->
            <div class="step">
                <div class="step-title">
                    <span class="step-number">2</span>
                    Choose a method
                </div>
                <div class="option-group">
                    <label class="option-card selected">
                        <input type="radio" name="method" value="max_quality" checked>
                        <div class="option-info">
                            <h4>MAX QUALITY + FPS METHOD <span class="tag">RECOMMENDED</span></h4>
                            <p>Preserves maximum sharpness and quality at 1080p target resolution.</p>
                        </div>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="method" value="fps">
                        <div class="option-info">
                            <h4>FPS Method</h4>
                            <p>Applies fast frame conversion and structural alignment without heavy filtering.</p>
                        </div>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="method" value="720p60">
                        <div class="option-info">
                            <h4>720p60 Method</h4>
                            <p>Scales down to 720p 60 FPS for low file weight and high upload speed.</p>
                        </div>
                    </label>
                </div>

                <label class="checkbox-label">
                    <input type="checkbox" name="tiktok" value="true">
                    Optimize file size for TikTok (Smaller upload size)
                </label>
            </div>

            <button type="submit" class="submit-btn" id="startBtn">Start processing &rarr;</button>
        </form>
    </div>
</div>

<!-- LOADING OVERLAY -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <h3>Encoding Video on Cloud Server...</h3>
    <p style="color: #8b8a9d; margin-top: 8px;">Please wait while Railway processes your video.</p>
</div>

<script>
    function updateFileName(input) {
        const display = document.getElementById('fileNameDisplay');
        if (input.files && input.files[0]) {
            display.textContent = "Selected: " + input.files[0].name;
            display.style.color = "#a855f7";
            display.style.fontWeight = "bold";
        }
    }

    // Radio selection styling script
    document.querySelectorAll('.option-card input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', function() {
            document.querySelectorAll('.option-card').forEach(card => card.classList.remove('selected'));
            this.closest('.option-card').classList.add('selected');
        });
    });

    // Display loader when form is submitted
    document.getElementById('optimizeForm').addEventListener('submit', function() {
        document.getElementById('loadingOverlay').style.display = 'flex';
    });
</script>

</body>
</html>
