<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXYEU Video Optimizer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #00e676;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        input[type="file"] {
            background: #2a2a2a;
            color: #eee;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 0.95rem;
            width: 100%;
        }

        button {
            background: #00e676;
            color: #121212;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #00c853;
        }

        .flash-messages {
            margin-bottom: 15px;
            list-style: none;
        }

        .flash-messages li {
            background: #ff5252;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .download-box {
            margin-top: 25px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
            border: 1px dashed #00e676;
        }

        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #00e676;
            color: #121212;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MAXYEU Video Optimizer</h1>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul class="flash-messages">
              {% for message in messages %}
                <li>{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form action="/optimize" method="POST" enctype="multipart/form-data">
            <input type="file" name="video" accept="video/*" required>
            <button type="submit">Optimize Video</button>
        </form>

        {% if download_file %}
            <div class="download-box">
                <p>Optimization Complete!</p>
                <a class="download-btn" href="{{ url_for('download_file', filename=download_file) }}">Download Processed Video</a>
            </div>
        {% endif %}
    </div>

</body>
</html>
